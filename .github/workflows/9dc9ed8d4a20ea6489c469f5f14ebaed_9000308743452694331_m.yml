        package com.example.stretchbox.data

        import android.content.Context
        import androidx.compose.runtime.getValue
        import androidx.compose.runtime.mutableIntStateOf
        import androidx.compose.runtime.mutableStateListOf
        import androidx.compose.runtime.mutableStateOf
        import androidx.compose.runtime.setValue
        import kotlin.math.roundToInt

        /**
         * 全部用户设置。
         * 字段是 Compose 状态，界面直接读写；[save] 落盘，[reload] 重新读盘。
         * SharedPreferences 的文件名和 key 与旧版保持一致，升级后原有设置不会丢。
         */
        class Settings(context: Context) {

            private val sp = context.applicationContext.getSharedPreferences("cfg", Context.MODE_PRIVATE)

            var pkg by mutableStateOf<String?>(null)

            // 输入框用字符串保存，允许用户清空后重新输入
            var widthText by mutableStateOf("")
            var heightText by mutableStateOf("")
            var dpiText by mutableStateOf("")

            /** 0 = 自动跟随真屏 */
            var refreshHz by mutableIntStateOf(0)
            var forceStop by mutableStateOf(true)

            /**
             * 服务启动通道："shizuku"（默认）= 经 Shizuku 授权；"root" = 直接 su 提权启动服务进程。
             * 手动切换，落盘后下次启动容器时生效。
             */
            var runMode by mutableStateOf(RUN_MODE_SHIZUKU)

            var gyroFix by mutableStateOf(false)
            var gyroInvert by mutableStateOf(false)
            var gyroDiag by mutableStateOf(false)

            var flipV by mutableStateOf(false)
            var flipH by mutableStateOf(false)

            /** 明度 / 对比度 / 饱和度 / 色温（-1..1），第 5 项锐化（0..1） */
            val adjust = mutableStateListOf(0f, 0f, 0f, 0f, 0f)

            init { reload() }

            fun reload() {
                pkg = sp.getString("pkg", null)
                widthText = sp.getInt("w", 0).takeIf { it > 0 }?.toString() ?: ""
                heightText = sp.getInt("h", 0).takeIf { it > 0 }?.toString() ?: ""
                dpiText = sp.getInt("dpi", 0).takeIf { it > 0 }?.toString() ?: ""
                refreshHz = sp.getInt("hz", 0)
                forceStop = sp.getBoolean("force", true)
                runMode = sp.getString("runMode", RUN_MODE_SHIZUKU) ?: RUN_MODE_SHIZUKU
                gyroFix = sp.getBoolean("gyroFix", false)
                gyroInvert = sp.getBoolean("gyroInvert", false)
                gyroDiag = sp.getBoolean("gyroDiag", false)
                flipV = sp.getBoolean("flipV", false)
                flipH = sp.getBoolean("flipH", false)
                for (i in 0..4) adjust[i] = sp.getFloat("adj$i", 0f)
            }

            fun save() {
                val e = sp.edit()
                pkg?.let { e.putString("pkg", it) }
                widthText.toIntOrNull()?.let { e.putInt("w", it) }
                heightText.toIntOrNull()?.let { e.putInt("h", it) }
                dpiText.toIntOrNull()?.let { e.putInt("dpi", it) }
                e.putInt("hz", refreshHz)
                e.putBoolean("force", forceStop)
                e.putString("runMode", runMode)
                e.putBoolean("gyroFix", gyroFix)
                e.putBoolean("gyroInvert", gyroInvert)
                e.putBoolean("gyroDiag", gyroDiag)
                e.putBoolean("flipV", flipV)
                e.putBoolean("flipH", flipH)
                for (i in 0..4) e.putFloat("adj$i", adjust[i])
                e.apply()
            }

            // ---------------- 便捷操作 ----------------

            /** 按比例设置虚拟屏分辨率；已有的 DPI 会保留，没有才用真屏 DPI */
            fun applyRatio(ratio: Double, longSide: Int, baseDpi: Int) {
                val w = longSide.coerceAtMost(3200)
                val h = (w / ratio / 2).roundToInt() * 2
                widthText = w.toString()
                heightText = h.toString()
                if (dpiText.toIntOrNull() == null) dpiText = baseDpi.toString()
            }

            fun applyFilter(preset: ColorFilterPreset) {
                for (i in 0..3) adjust[i] = preset.values[i]
            }

            fun resetAdjust() {
                for (i in 0..4) adjust[i] = 0f
            }

            /** 当前调节值正好等于哪个滤镜预设，没有则返回 -1 */
            fun matchedFilterIndex(): Int = COLOR_FILTERS.indexOfFirst { p ->
                (0..3).all { i -> kotlin.math.abs(adjust[i] - p.values[i]) < 0.001f }
            }

            companion object {
                private const val SP_NAME = "cfg"
                private const val KEY_RUN_MODE = "runMode"

                /** 读盘当前服务启动通道为 Root 时返回 true（无 Settings 实例也可调用） */
                fun isRootMode(ctx: Context): Boolean {
                    val sp = ctx.applicationContext.getSharedPreferences(SP_NAME, Context.MODE_PRIVATE)
                    return sp.getString(KEY_RUN_MODE, RUN_MODE_SHIZUKU) == RUN_MODE_ROOT
                }
            }
        }

        /** 服务启动通道常量：Shizuku / Root 手动切换 */
        const val RUN_MODE_SHIZUKU = "shizuku"
        const val RUN_MODE_ROOT = "root"
