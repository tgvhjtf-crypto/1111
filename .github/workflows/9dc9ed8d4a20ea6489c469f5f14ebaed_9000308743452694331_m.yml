        package com.example.stretchbox.util

        import android.app.ActivityManager
        import android.app.ApplicationExitInfo
        import android.content.Context
        import android.util.Log

        /** 记录崩溃堆栈，下次打开时展示；同时检查进程是否被系统异常终止 */
        object CrashReporter {

            private const val PREF = "crash"

            fun install(context: Context) {
                val sp = context.applicationContext.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                Thread.setDefaultUncaughtExceptionHandler { _, e ->
                    sp.edit().putString("log", Log.getStackTraceString(e)).commit()
                    android.os.Process.killProcess(android.os.Process.myPid())
                }
            }

            /** 取出（并清除）上次的异常报告，没有则返回 null */
            fun consumeReport(context: Context): String? {
                val sp = context.applicationContext.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                val crash = sp.getString("log", null)
                if (crash != null) sp.edit().remove("log").apply()

                // 只关心异常退出；用户划掉应用之类的正常退出不提示
                var exitText: String? = null
                try {
                    val am = context.getSystemService(ActivityManager::class.java)
                    val info = am.getHistoricalProcessExitReasons(context.packageName, 0, 1).firstOrNull()
                    if (info != null && info.timestamp > sp.getLong("exitTs", 0L)) {
                        sp.edit().putLong("exitTs", info.timestamp).apply()
                        reasonName(info.reason)?.let { name ->
                            exitText = "退出原因：$name（status=${info.status}）\n${info.description ?: ""}"
                        }
                    }
                } catch (_: Throwable) {
                }

                return when {
                    crash != null -> crash.take(4000)
                    else -> exitText
                }
            }

            private fun reasonName(reason: Int): String? = when (reason) {
                ApplicationExitInfo.REASON_CRASH -> "应用崩溃"
                ApplicationExitInfo.REASON_CRASH_NATIVE -> "原生崩溃"
                ApplicationExitInfo.REASON_ANR -> "无响应 (ANR)"
                ApplicationExitInfo.REASON_LOW_MEMORY -> "内存不足被系统回收"
                ApplicationExitInfo.REASON_EXCESSIVE_RESOURCE_USAGE -> "资源占用过高被系统终止"
                ApplicationExitInfo.REASON_INITIALIZATION_FAILURE -> "初始化失败"
                else -> null
            }
        }
