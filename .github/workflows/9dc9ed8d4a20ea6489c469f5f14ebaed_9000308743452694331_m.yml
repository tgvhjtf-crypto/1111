            }
        }

        private fun ratioMatches(s: Settings, r: AspectRatio): Boolean {
            val w = s.widthText.toIntOrNull() ?: return false
            val h = s.heightText.toIntOrNull() ?: return false
            return h > 0 && abs(w.toDouble() / h - r.value) < 0.01
        }

