            TabItem("首页", Icons.Filled.Home),
            TabItem("画面", Icons.Filled.Edit),
            TabItem("设置", Icons.Filled.Settings),
        )

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun MainScreen(
            settings: Settings,
            shizuku: ShizukuState,
            device: DeviceInfo,
            apps: List<AppInfo>,
            onStatusClick: () -> Unit,
            onRefresh: () -> Unit,
            onStart: () -> Unit,
            onCopy: (String) -> Unit,
        ) {
            var tab by rememberSaveable { mutableStateOf(0) }

            Scaffold(
                containerColor = MaterialTheme.colorScheme.background,
                topBar = {
                    TopAppBar(
                        title = { Text("云朵工具箱", fontWeight = FontWeight.SemiBold) },
                        actions = {
                            IconButton(onClick = onRefresh) {
                                Icon(Icons.Filled.Refresh, contentDescription = "重新检测")
                            }
                        },
                        colors = TopAppBarDefaults.topAppBarColors(containerColor = Color.Transparent),
                    )
                },
                bottomBar = {
                    NavigationBar {
                        TABS.forEachIndexed { index, item ->
                            NavigationBarItem(
                                selected = tab == index,
                                onClick = { tab = index },
                                icon = { Icon(item.icon, contentDescription = null) },
                                label = { Text(item.label) },
                            )
                        }
                    }
                },
                floatingActionButton = {
                    if (tab == 0) {
                        ExtendedFloatingActionButton(
                            onClick = onStart,
                            icon = { Icon(Icons.Filled.PlayArrow, contentDescription = null) },
                            text = { Text("进入容器并启动") },
                        )
                    }
                },
            ) { inner ->
                val content = Modifier
                    .fillMaxSize()
                    .padding(inner)
                when (tab) {
                    0 -> HomeScreen(settings, shizuku, device, apps, onStatusClick, content)
                    1 -> DisplayScreen(settings, content)
                    else -> AdvancedScreen(settings, device, onCopy, content)
                }
            }
        }
