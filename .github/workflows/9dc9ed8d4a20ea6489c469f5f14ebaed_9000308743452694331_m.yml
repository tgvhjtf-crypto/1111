        package com.example.stretchbox.root

        import android.content.Context
        import android.net.LocalSocket
        import android.net.LocalSocketAddress
        import android.os.IBinder
        import com.example.stretchbox.IStretchService
        import java.io.DataInputStream
        import java.io.DataOutputStream

        /**
         * Root 启动通道：完全不依赖 Shizuku。
         * 通过 `su -c app_process` 在 root 身份下启动 [com.example.stretchbox.service.StretchService] 进程，
         * 该进程在 LocalSocket 上监听并把 AIDL binder 经 Parcel 序列化回传，App 侧据此拿到
         * [IStretchService] 直接调用，能力与 Shizuku UserService 完全一致。
         */
        object RootClient {

            const val SOCKET_NAME = "stretchbox_root"
            private const val PROCESS_CLASS = "com.example.stretchbox.service.StretchServiceKt"

            @Volatile var service: IStretchService? = null
                private set

            private var serverProcess: Process? = null

            /** 检测设备是否已 root（su 可用） */
            fun isRootAvailable(): Boolean = try {
                val p = ProcessBuilder("su", "-c", "id").redirectErrorStream(true).start()
                val out = p.inputStream.bufferedReader().readText()
                p.waitFor()
                out.contains("uid=0") || out.contains("root")
            } catch (_: Throwable) {
                false
            }

            /** 执行一条 root 命令，返回输出（合并 stderr） */
            fun exec(vararg cmd: String): String = try {
                val p = ProcessBuilder("su", "-c", cmd.joinToString(" ")).redirectErrorStream(true).start()
                val out = p.inputStream.bufferedReader().readText()
                p.waitFor()
                out.trim()
            } catch (t: Throwable) {
                "ERR: $t"
            }

            /**
             * 通过 su 启动 root 服务进程并绑定。
             * @return 错误信息；成功返回 null
             */
            fun startAndBind(ctx: Context): String? {
                if (service != null) return null
                return try {
                    val base = ctx.applicationInfo.sourceDir
                    // 用 nohup 后台运行，避免 su 会话结束后进程被杀
                    val full = "nohup app_process -cp $base /data/local/tmp $PROCESS_CLASS --socket $SOCKET_NAME >/dev/null 2>&1 &"
                    val p = ProcessBuilder("su", "-c", full).redirectErrorStream(true).start()
                    p.inputStream.bufferedReader().readText()
                    p.waitFor()

                    // 等待服务端就绪（最多 2 秒）
                    val deadline = System.currentTimeMillis() + 2000
                    var lastErr: String? = "连接 root 服务超时"
                    while (System.currentTimeMillis() < deadline) {
                        try {
                            bindSocket()
                            lastErr = null
                            break
                        } catch (t: Throwable) {
                            lastErr = t.message
                            Thread.sleep(80)
                        }
                    }
                    lastErr
                } catch (t: Throwable) {
                    "root 服务启动失败: ${t.message}"
                }
            }

             private fun bindSocket() {
                val sock = LocalSocket()
                try {
                    sock.connect(LocalSocketAddress(SOCKET_NAME, LocalSocketAddress.Namespace.ABSTRACT))
                    val out = DataOutputStream(sock.outputStream)
                    val input = DataInputStream(sock.inputStream)
                    out.writeUTF("BIND")
                    out.flush()

                    // 服务端把 binder 经 Parcel.marshall() 序列化成字节数组发回，
                    // 客户端用 Parcel.unmarshall() + readStrongBinder() 反序列化，纯 Java/Kotlin，无需 JNI。
                    val len = input.readInt()
                    if (len <= 0) throw IllegalStateException("binder 数据为空")
                    val bytes = ByteArray(len)
                    input.readFully(bytes)

                    val parcel = android.os.Parcel.obtain()
                    parcel.unmarshall(bytes, 0, bytes.size)
                    parcel.setDataPosition(0)
                    val binder: IBinder? = parcel.readStrongBinder()
                    parcel.recycle()

                    service = binder?.let { IStretchService.Stub.asInterface(it) }
                        ?: throw IllegalStateException("binder 为空")
                } finally {
                    try { sock.close() } catch (_: Throwable) {}
                }
            }

            /** 断开并回收 root 服务进程 */
            fun shutdown() {
                try { service?.destroy() } catch (_: Throwable) {}
                service = null
                serverProcess?.destroy()
                serverProcess = null
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/render/StretchRenderer.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/render/StretchRenderer.kt' <<'STRETCH_EOF'
        package com.example.stretchbox.render

        import android.graphics.SurfaceTexture
        import android.opengl.GLES11Ext
        import android.opengl.GLES20
        import android.opengl.GLSurfaceView
        import android.util.Log
        import android.view.Surface
        import java.nio.ByteBuffer
        import java.nio.ByteOrder
        import java.nio.FloatBuffer
        import javax.microedition.khronos.egl.EGLConfig
        import javax.microedition.khronos.opengles.GL10

        /**
         * 用 OpenGL 把虚拟屏的 SurfaceTexture 画到全屏。
         * 支持：明度/对比度/饱和度/色温、锐化、上下/左右翻转、0/90/180/270 旋转（陀螺仪修复模式用）。
         */
        class StretchRenderer(
            private val bufW: Int,
            private val bufH: Int,
            private val onSurfaceReady: (Surface) -> Unit
        ) : GLSurfaceView.Renderer, SurfaceTexture.OnFrameAvailableListener {

            private var surfaceTexture: SurfaceTexture? = null
            private var surface: Surface? = null
            private var view: GLSurfaceView? = null
            private var program = 0
            private var texId = 0

            private var uTexMatrix = 0
            private var uBrightness = 0
            private var uContrast = 0
            private var uSaturation = 0
            private var uWarmth = 0
            private var uSharp = 0
            private var uTexel = 0
            private var aPos = 0
            private var aUV = 0

            @Volatile private var brightness = 0f
            @Volatile private var contrast = 0f
            @Volatile private var saturation = 0f
            @Volatile private var warmth = 0f
            @Volatile private var sharp = 0f
            @Volatile private var rotation = 0
            @Volatile private var flipV = false
            @Volatile private var flipH = false

            private val texMatrix = FloatArray(16)
            private val quadData = FloatArray(8)
            private val quad: FloatBuffer = newFloatBuffer(0f, 0f, 0f, 0f, 0f, 0f, 0f, 0f)
            private val texCoords: FloatBuffer = newFloatBuffer(0f, 0f, 0f, 0f, 0f, 0f, 0f, 0f)

            /** 掉帧修复：新帧到来时置位，渲染线程消费后清位；避免每帧无谓 updateTexImage */
            private val pendingFrame = java.util.concurrent.atomic.AtomicBoolean(false)
            @Volatile private var texMatrixDirty = false

            private fun newFloatBuffer(vararg v: Float): FloatBuffer =
                ByteBuffer.allocateDirect(v.size * 4).order(ByteOrder.nativeOrder())
                    .asFloatBuffer().apply { put(v); position(0) }

            fun setView(v: GLSurfaceView) { view = v }

            fun setColors(b: Float, c: Float, s: Float, w: Float) {
                brightness = b; contrast = c; saturation = s; warmth = w
            }

            /** 锐化强度 0..1 */
            fun setSharpness(v: Float) { sharp = v }

            /** 缓冲区内容相对于显示方向的旋转：Display.getRotation() 的值 0..3 */
            fun setRotation(r: Int) { rotation = r and 3 }

            fun setFlip(h: Boolean, v: Boolean) { flipH = h; flipV = v }

            override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                surfaceTexture?.release()
                surface?.release()
                surfaceTexture = null
                surface = null

                program = buildProgram(VERT, FRAG)
                uTexMatrix = GLES20.glGetUniformLocation(program, "uTexMatrix")
                uBrightness = GLES20.glGetUniformLocation(program, "uBrightness")
                uContrast = GLES20.glGetUniformLocation(program, "uContrast")
                uSaturation = GLES20.glGetUniformLocation(program, "uSaturation")
                uWarmth = GLES20.glGetUniformLocation(program, "uWarmth")
                uSharp = GLES20.glGetUniformLocation(program, "uSharp")
                uTexel = GLES20.glGetUniformLocation(program, "uTexel")
                aPos = GLES20.glGetAttribLocation(program, "aPos")
                aUV = GLES20.glGetAttribLocation(program, "aUV")
                val ids = IntArray(1)
                GLES20.glGenTextures(1, ids, 0)
                texId = ids[0]
                GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, texId)
                GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
                GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)

                val st = SurfaceTexture(texId)
                st.setDefaultBufferSize(bufW, bufH)
                // 掉帧修复 ⑥：三缓冲，让生产者/消费者更平滑，减少等待导致的帧丢失
                try {
                    SurfaceTexture::class.java.getDeclaredMethod("setMaxBufferCount", Int::class.javaPrimitiveType)
                        .apply { isAccessible = true }.invoke(st, 3)
                } catch (t: Throwable) {
                    Log.w(TAG, "setMaxBufferCount(3) 不可用，沿用默认缓冲", t)
                }
                st.setOnFrameAvailableListener(this)
                surfaceTexture = st
                // 掉帧修复 ⑦：重建纹理时复位帧状态，避免上一次 SurfaceTexture 的标志残留
                pendingFrame.set(false)
                texMatrixDirty = false
                val s = Surface(st)
                surface = s
                onSurfaceReady(s)
            }

            override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                GLES20.glViewport(0, 0, width, height)
            }

            override fun onDrawFrame(gl: GL10?) {
                val st = surfaceTexture ?: return
                GLES20.glClearColor(0f, 0f, 0f, 1f)
                GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)

                // 掉帧修复 ③：只有新帧到来才 updateTexImage + 取变换矩阵，
                // 否则直接复用上一帧的矩阵与纹理，避免每次 requestRender 都做无用功。
                if (pendingFrame.compareAndSet(true, false)) {
                    try { st.updateTexImage() } catch (_: Throwable) { return }
                    st.getTransformMatrix(texMatrix)
                    texMatrixDirty = true
                } else if (!texMatrixDirty) {
                    // 还没收到第一帧，没有内容可画，直接返回
                    return
                }

                // 顶点顺序：左下、右下、左上、右上。翻转 = 交换顶点位置，画面内容不变
                val x0 = if (flipH) 1f else -1f
                val y0 = if (flipV) 1f else -1f
                quadData[0] = x0;  quadData[1] = y0
                quadData[2] = -x0; quadData[3] = y0
                quadData[4] = x0;  quadData[5] = -y0
                quadData[6] = -x0; quadData[7] = -y0
                quad.position(0); quad.put(quadData); quad.position(0)
                texCoords.position(0); texCoords.put(TEX[rotation and 3]); texCoords.position(0)

                GLES20.glUseProgram(program)
                GLES20.glUniformMatrix4fv(uTexMatrix, 1, false, texMatrix, 0)
                GLES20.glUniform1f(uBrightness, brightness)
                GLES20.glUniform1f(uContrast, contrast)
                GLES20.glUniform1f(uSaturation, saturation)
                GLES20.glUniform1f(uWarmth, warmth)
                GLES20.glUniform1f(uSharp, sharp)
                GLES20.glUniform2f(uTexel, 1f / bufW, 1f / bufH)

                GLES20.glEnableVertexAttribArray(aPos)
                GLES20.glVertexAttribPointer(aPos, 2, GLES20.GL_FLOAT, false, 0, quad)
                GLES20.glEnableVertexAttribArray(aUV)
                GLES20.glVertexAttribPointer(aUV, 2, GLES20.GL_FLOAT, false, 0, texCoords)
                GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
            }

            override fun onFrameAvailable(st: SurfaceTexture) {
                // 掉帧修复 ⑤：只置标志位并请求渲染，不在回调里做重活
                pendingFrame.set(true)
                view?.requestRender()
            }

            private fun buildProgram(vs: String, fs: String): Int {
                fun compile(type: Int, src: String): Int {
                    val id = GLES20.glCreateShader(type)
                    GLES20.glShaderSource(id, src)
                    GLES20.glCompileShader(id)
                    val ok = IntArray(1)
                    GLES20.glGetShaderiv(id, GLES20.GL_COMPILE_STATUS, ok, 0)
                    if (ok[0] == 0) Log.e(TAG, "着色器编译失败: " + GLES20.glGetShaderInfoLog(id))
                    return id
                }
                val v = compile(GLES20.GL_VERTEX_SHADER, vs)
                val f = compile(GLES20.GL_FRAGMENT_SHADER, fs)
                val p = GLES20.glCreateProgram()
                GLES20.glAttachShader(p, v)
                GLES20.glAttachShader(p, f)
                GLES20.glLinkProgram(p)
                return p
            }

            companion object {
                private const val TAG = "StretchRenderer"

                /**
                 * 四个顶点（左下、右下、左上、右上）对应的纹理坐标，按旋转 0/90/180/270 取。
                 * 旋转 0 是标准 SurfaceTexture 写法（左下=(0,0)），系统给的 uTexMatrix 已含一次上下翻转，
                 * 所以这里不能再预先翻转，否则画面会上下颠倒。
                 */
                private val TEX = arrayOf(
                    floatArrayOf(0f, 0f, 1f, 0f, 0f, 1f, 1f, 1f),
                    floatArrayOf(0f, 1f, 0f, 0f, 1f, 1f, 1f, 0f),
                    floatArrayOf(1f, 1f, 0f, 1f, 1f, 0f, 0f, 0f),
                    floatArrayOf(1f, 0f, 1f, 1f, 0f, 0f, 0f, 1f)
                )

                private const val VERT = """
        attribute vec4 aPos;
        attribute vec2 aUV;
        uniform mat4 uTexMatrix;
        varying vec2 vUV;
        void main() { gl_Position = aPos; vUV = (uTexMatrix * vec4(aUV, 0.0, 1.0)).xy; }
        """

                private const val FRAG = """
        #extension GL_OES_EGL_image_external : require
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform samplerExternalOES sTex;
        uniform float uBrightness;
        uniform float uContrast;
        uniform float uSaturation;
        uniform float uWarmth;
        uniform float uSharp;
        uniform vec2 uTexel;
        varying vec2 vUV;
        void main() {
            vec3 rgb = texture2D(sTex, vUV).rgb;
            if (uSharp > 0.001) {
                vec3 n = texture2D(sTex, vUV + vec2(uTexel.x, 0.0)).rgb
                       + texture2D(sTex, vUV - vec2(uTexel.x, 0.0)).rgb
                       + texture2D(sTex, vUV + vec2(0.0, uTexel.y)).rgb
                       + texture2D(sTex, vUV - vec2(0.0, uTexel.y)).rgb;
                rgb = rgb + (rgb * 4.0 - n) * uSharp * 0.6;
            }
            rgb = rgb + uBrightness;
            rgb = (rgb - 0.5) * (1.0 + uContrast) + 0.5;
            float g = dot(rgb, vec3(0.299, 0.587, 0.114));
            rgb = mix(vec3(g), rgb, 1.0 + uSaturation);
            rgb.r += uWarmth * 0.12;
            rgb.b -= uWarmth * 0.12;
            gl_FragColor = vec4(clamp(rgb, 0.0, 1.0), 1.0);
        }
        """
            }
        }
