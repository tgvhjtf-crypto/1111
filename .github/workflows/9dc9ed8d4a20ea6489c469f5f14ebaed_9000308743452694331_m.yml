                        NumberField("高 px", settings.heightText, { settings.heightText = it }, Modifier.weight(1f))
                        NumberField("DPI", settings.dpiText, { settings.dpiText = it }, Modifier.weight(1f))
                    }
                    Spacer(Modifier.height(16.dp))
