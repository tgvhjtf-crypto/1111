        package com.example.stretchbox.service

        import android.os.IBinder
        import android.os.SystemClock
        import android.view.InputDevice
        import android.view.InputEvent
        import android.view.KeyCharacterMap
        import android.view.KeyEvent
        import android.view.MotionEvent

        /**
         * 通过 IInputManager.injectInputEvent 向指定 displayId 注入事件。
         * 只有 shell/system uid 才有 INJECT_EVENTS 权限，所以必须在 Shizuku 进程里跑。
         */
        class InputInjector {
            private val iInputManager: Any
            private val injectMethod: java.lang.reflect.Method
            private val setDisplayId: java.lang.reflect.Method =
                InputEvent::class.java.getMethod("setDisplayId", Int::class.javaPrimitiveType)

            init {
                val binder = Class.forName("android.os.ServiceManager")
                    .getMethod("getService", String::class.java)
                    .invoke(null, "input") as IBinder
                iInputManager = Class.forName("android.hardware.input.IInputManager\$Stub")
                    .getMethod("asInterface", IBinder::class.java)
                    .invoke(null, binder)!!
                injectMethod = Class.forName("android.hardware.input.IInputManager")
                    .getMethod("injectInputEvent", InputEvent::class.java, Int::class.javaPrimitiveType)
            }

            private fun inject(ev: InputEvent, displayId: Int) {
                setDisplayId.invoke(ev, displayId)
                injectMethod.invoke(iInputManager, ev, 0 /* INJECT_INPUT_EVENT_MODE_ASYNC */)
            }

            fun touch(displayId: Int, ev: MotionEvent) {
                try {
                    ev.source = InputDevice.SOURCE_TOUCHSCREEN
                    inject(ev, displayId)
                } finally {
                    ev.recycle()
                }
            }

            fun key(displayId: Int, keyCode: Int) {
                val now = SystemClock.uptimeMillis()
                for (action in intArrayOf(KeyEvent.ACTION_DOWN, KeyEvent.ACTION_UP)) {
                    val e = KeyEvent(
                        now, now, action, keyCode, 0, 0,
                        KeyCharacterMap.VIRTUAL_KEYBOARD, 0, 0, InputDevice.SOURCE_KEYBOARD
                    )
                    inject(e, displayId)
                }
            }
        }
