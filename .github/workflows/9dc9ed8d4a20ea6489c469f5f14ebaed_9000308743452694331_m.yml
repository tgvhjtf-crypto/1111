        package com.example.stretchbox.service

        import android.hardware.display.DisplayManager
        import android.hardware.display.VirtualDisplay
        import android.net.LocalServerSocket
        import android.net.LocalSocket
        import android.os.Build
        import android.os.Parcel
        import android.util.Log
        import android.view.MotionEvent
        import android.view.Surface
        import com.example.stretchbox.IStretchService
        import java.io.DataInputStream
        import java.io.DataOutputStream
        import kotlin.system.exitProcess

        /**
         * Shizuku UserService：运行在 shell uid 的独立进程中。
         * 职责：1) 创建虚拟屏  2) 把游戏启动到虚拟屏  3) 向虚拟屏注入触摸/按键
         */
        class StretchService : IStretchService.Stub() {

            private companion object {
                const val TAG = "StretchService"

                // VirtualDisplay 的 flag（部分是 hidden API，数值固定）
                const val FLAG_PUBLIC = 1 shl 0
                const val FLAG_OWN_CONTENT_ONLY = 1 shl 3
                const val FLAG_SUPPORTS_TOUCH = 1 shl 6
                const val FLAG_ROTATES_WITH_CONTENT = 1 shl 7
                const val FLAG_DESTROY_CONTENT_ON_REMOVAL = 1 shl 8
                const val FLAG_TRUSTED = 1 shl 10
                const val FLAG_OWN_DISPLAY_GROUP = 1 shl 11
                const val FLAG_ALWAYS_UNLOCKED = 1 shl 12
                const val FLAG_OWN_FOCUS = 1 shl 14
            }

            private var initError: String? = null
            private var displayManager: DisplayManager? = null
            private var injector: InputInjector? = null
            private var vd: VirtualDisplay? = null
            private var prevForceResizable: String? = null
            private var rotatesWithContent = false

            init {
                // 构造函数在 Shizuku 的主线程执行，这里初始化 hidden API 相关对象
                try {
                    val ctx = FakeContext.create()
                    val ctor = DisplayManager::class.java.getDeclaredConstructor(android.content.Context::class.java)
                        .apply { isAccessible = true }
                    displayManager = ctor.newInstance(ctx)
                } catch (t: Throwable) {
                    initError = "DisplayManager 初始化失败: $t"; Log.e(TAG, initError!!, t)
                }
                try {
                    injector = InputInjector()
                } catch (t: Throwable) {
                    Log.e(TAG, "InputInjector 初始化失败", t)
                }
            }

            private fun sh(vararg cmd: String): String = try {
                val p = ProcessBuilder(*cmd).redirectErrorStream(true).start()
                val out = p.inputStream.bufferedReader().readText()
                p.waitFor()
                out.trim()
            } catch (t: Throwable) { "ERR: $t" }

            /** Android 14+：请求高刷新率；失败返回 null，调用方会回退到普通创建方式 */
            private fun createWithRefreshRate(
                dm: DisplayManager, width: Int, height: Int, dpi: Int, refreshRate: Float, surface: Surface?, flags: Int
            ): VirtualDisplay? {
                if (Build.VERSION.SDK_INT < 34) return null
                return try {
                    val rate = if (refreshRate > 0f) refreshRate else (dm.getDisplay(0)?.refreshRate ?: return null)
                    if (rate <= 60.5f) return null
                    val bCls = Class.forName("android.hardware.display.VirtualDisplayConfig\$Builder")
                    val i = Int::class.javaPrimitiveType
                    val b = bCls.getConstructor(String::class.java, i, i, i).newInstance("StretchBox", width, height, dpi)
                    bCls.getMethod("setFlags", i).invoke(b, flags)
                    bCls.getMethod("setSurface", Surface::class.java).invoke(b, surface)
                    bCls.getMethod("setRequestedRefreshRate", Float::class.javaPrimitiveType).invoke(b, rate)
                    val cfg = bCls.getMethod("build").invoke(b)
                    val cfgCls = Class.forName("android.hardware.display.VirtualDisplayConfig")
                    val m = DisplayManager::class.java.declaredMethods
                        .filter { it.name == "createVirtualDisplay" && it.parameterTypes.any { p -> p == cfgCls } }
                        .minByOrNull { it.parameterCount } ?: return null
                    m.isAccessible = true
                    val args = m.parameterTypes.map { if (it == cfgCls) cfg else null }.toTypedArray()
                    m.invoke(dm, *args) as? VirtualDisplay
                } catch (t: Throwable) {
                    Log.e(TAG, "高刷新率创建失败，回退", t); null
                }
            }

            // ---------------- 虚拟屏 ----------------

            @Synchronized
            override fun createDisplay(width: Int, height: Int, dpi: Int, refreshRate: Float, surface: Surface?): Int {
                vd?.let { // 已存在：复用，只换 Surface / 尺寸
                    it.surface = surface
                    it.resize(width, height, dpi)
                    return it.display.displayId
                }
                val dm = displayManager ?: throw IllegalStateException(initError ?: "DisplayManager 不可用")

                var flags = FLAG_PUBLIC or FLAG_OWN_CONTENT_ONLY or FLAG_SUPPORTS_TOUCH or
                        FLAG_DESTROY_CONTENT_ON_REMOVAL
                // 掉帧修复 ①：去掉 FLAG_TRUSTED / FLAG_OWN_DISPLAY_GROUP，
                // 这两者会增加与真屏的合成联动负担，是掉帧来源之一。
                if (Build.VERSION.SDK_INT >= 33) {
                    flags = flags or FLAG_ALWAYS_UNLOCKED or FLAG_OWN_FOCUS
                }

                if (rotatesWithContent) flags = flags or FLAG_ROTATES_WITH_CONTENT

                val d = createWithRefreshRate(dm, width, height, dpi, refreshRate, surface, flags)
                    ?: dm.createVirtualDisplay("StretchBox", width, height, dpi, surface, flags)
                    ?: throw IllegalStateException("createVirtualDisplay 返回 null")
                vd = d

                // 让不可缩放(resizeableActivity=false)的游戏也能铺满虚拟屏
                prevForceResizable = sh("settings", "get", "global", "force_resizable_activities")
                sh("settings", "put", "global", "force_resizable_activities", "1")
                return d.display.displayId
            }

            override fun configure(rotatesWithContent: Boolean) {
                this.rotatesWithContent = rotatesWithContent
            }

            override fun setDisplayRotation(displayId: Int, rotation: Int): String =
                sh("cmd", "window", "user-rotation", "-d", displayId.toString(), "lock", rotation.toString())

            @Synchronized
            override fun resizeDisplay(width: Int, height: Int, dpi: Int) {
                vd?.resize(width, height, dpi)
            }

            @Synchronized
            override fun setSurface(surface: Surface?) {
                vd?.surface = surface
            }

            @Synchronized
            override fun releaseDisplay() {
                vd?.release()
                vd = null
                prevForceResizable?.let {
                    if (it == "null" || it.isEmpty()) sh("settings", "delete", "global", "force_resizable_activities")
                    else sh("settings", "put", "global", "force_resizable_activities", it)
                }
                prevForceResizable = null
            }

            // ---------------- 启动游戏 ----------------

            override fun launch(pkg: String, displayId: Int, forceStop: Boolean): String {
                if (forceStop) sh("am", "force-stop", pkg)
                val resolved = sh(
                    "cmd", "package", "resolve-activity", "--brief",
                    "-a", "android.intent.action.MAIN", "-c", "android.intent.category.LAUNCHER", pkg
                )
                val component = resolved.lines().map { it.trim() }.lastOrNull { it.contains('/') && !it.contains(' ') }
                    ?: return "找不到启动 Activity: $resolved"
                                val args = mutableListOf("am", "start", "--display", displayId.toString(), "--activity-exclude-from-recents")
                if (forceStop) args.add("--activity-clear-task")
                args.addAll(listOf("-n", component))
                return sh(*args.toTypedArray())
            }

            // ---------------- 输入 ----------------

            override fun injectTouch(displayId: Int, event: MotionEvent) {
                val inj = injector
                if (inj == null) { event.recycle(); return }
                try { inj.touch(displayId, event) } catch (t: Throwable) { Log.e(TAG, "injectTouch", t) }
            }

            override fun injectKey(displayId: Int, keyCode: Int) {
                try { injector?.key(displayId, keyCode) } catch (t: Throwable) { Log.e(TAG, "injectKey", t) }
            }

            override fun destroy() {
                releaseDisplay()
                exitProcess(0)
            }
        }

        /**
         * Root 模式独立进程入口。
         * 通过 `su -c app_process ... StretchService --socket <name>` 启动，
         * 进程成为 LocalSocket 服务端：accept 一个连接后，把自身的 AIDL binder
         * 经 [Parcel.writeStrongBinder] + [Parcel.marshall] 序列化为字节数组回传，
         * App 侧用 RootClient 反序列化拿到 IStretchService 代理。
         */
        fun main(args: Array<String>) {
            val socketName = args.getOrNull(0)?.takeIf { it == "--socket" }?.let { args.getOrNull(1) }
                ?: "stretchbox_root"
            val server = LocalServerSocket(socketName)
            try {
                val conn = server.accept()
                val input = DataInputStream(conn.inputStream)
                val output = DataOutputStream(conn.outputStream)
                // 读取握手请求（约定为 "BIND"，此处兼容任意非空请求）
                input.readUTF()

                val parcel = Parcel.obtain()
                val svc = StretchService()
                parcel.writeStrongBinder(svc.asBinder())
                val bytes = parcel.marshall()
                parcel.recycle()

                output.writeInt(bytes.size)
                output.write(bytes)
                output.flush()
                conn.close()
            } catch (t: Throwable) {
                Log.e("StretchService", "root socket 服务失败", t)
            } finally {
                try { server.close() } catch (_: Throwable) {}
            }
        }
        STRETCH_EOF
